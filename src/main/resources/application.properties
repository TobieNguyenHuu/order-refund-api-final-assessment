spring.application.name=order-api
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# ==================== Database ====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/order_api}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==================== JPA ====================
# validate: schema chi duoc tao boi Flyway, Hibernate chi kiem tra khop
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================== Flyway ====================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ==================== JWT ====================
security.jwt.signer-key=${JWT_SIGNER_KEY:9a4f2c8d3b7e1a5f2c8d3b7e1a5f2c8d3b7e1a5f2c8d3b7e1a5f2c8d3b7e1a5f}
security.jwt.valid-duration=3600

# ==================== Swagger ====================
springdoc.api-docs.path=/api/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.use-root-path=true
